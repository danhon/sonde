# fleet.yml: what sonde says it is, for fleet-check (reverse-proxy
# docs-site/docs/services/fleet-check.md). The waivers are bootstrapped, for the
# gaps found when the gate started (reverse-proxy#15); the issue named ends them.
service: sonde
kind: web
host: sonde.sgc.rayandhon.com
internet: false
issue: 4
waivers:
- {check: healthz, until: 2026-12-15, issue: 4, why: liveness endpoint or healthcheck
    missing, bootstrap: true}
- {check: public-guard, until: 2026-12-15, issue: 4, why: router open without Authelia
    or public-guard, bootstrap: true}
- {check: log-mount, until: 2026-12-15, issue: 4, why: not logging to ~/<app>-logs
    yet, bootstrap: true}
- {check: venv-cache, until: 2026-12-15, issue: 4, why: Dockerfile predates the .venv
    cache rules, bootstrap: true}
- {check: clean-deploy, until: 2026-12-15, issue: 4, why: checkout not clean or not
    at the running commit, bootstrap: true}
