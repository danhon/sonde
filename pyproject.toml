[project]
name = "sonde"
version = "0.1.0"
description = "Bluesky follower tracker — verification, influence, and change over time"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "apscheduler>=3.10,<4",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "aiosqlite>=0.19",
]

[project.scripts]
sonde = "sonde.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Hatchling only packages .py by default — schema.sql and templates would be
# missing at runtime. See reverse-proxy troubleshooting.md.
[tool.hatch.build.targets.wheel]
include = ["sonde/**/*.py", "sonde/**/*.sql", "sonde/**/*.html"]

[tool.uv]
package = true
dev-dependencies = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
