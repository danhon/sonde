[project]
name = "sonde"
version = "0.1.0"
description = "Bluesky follower tracker — verification, influence, and change over time"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    # Form bodies. Every route before M25 took query parameters, so FastAPI
    # never needed this; batch tagging posts a repeated `did` field, which is
    # a form. Pure Python, no build step.
    "python-multipart>=0.0.9",
    "apscheduler>=3.10,<4",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "aiosqlite>=0.19",
    "aiosmtplib>=3.0",
    # python:3.12-slim ships no system tzdata, so ZoneInfo("America/Los_Angeles")
    # raises in the container while working fine on a dev Mac. The digest is
    # scheduled in Pacific time, so this is load-bearing.
    "tzdata>=2024.1",
    "pillow>=13.0.0",
]

[project.scripts]
sonde = "sonde.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Hatchling only packages .py by default — schema.sql and templates would be
# missing at runtime. See reverse-proxy troubleshooting.md.
[tool.hatch.build.targets.wheel]
# static/: the compiled stylesheet and sonde.js (sonde#6). Without them the
# image serves pages that 404 their own CSS.
include = ["sonde/**/*.py", "sonde/**/*.sql", "sonde/**/*.html", "sonde/web/static/*"]

[tool.uv]
package = true
dev-dependencies = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# A test still running after 60 s prints every thread's stack, so a hang
# (the first CI run, 2026-11-15, stalled for 10 minutes) says where it is.
faulthandler_timeout = 60
# And one still running after 120 s fails (pytest-timeout), so a hang can't hold
# box-gate's lock for every session on the box (it held it 44 min, 2026-11-15).
timeout = 120
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
