services:
  app:
    build:
      context: .
      args:
        - GIT_SHA
        - BUILD_TIME
    env_file: .env
    networks: [traefik_default]
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    labels:
      - "traefik.enable=true"

      # Main router — Authelia-guarded
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${SERVICE_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=le"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=authelia@file"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=8090"

      # Health router — no Authelia, higher priority. Authelia attaches to the
      # ROUTER, not the path: on a single router /healthz 302s to the login page
      # and the watchdog reads the app as down. /healthz exposes liveness only.
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-health.rule=Host(`${SERVICE_HOST}`) && Path(`/healthz`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-health.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-health.tls.certresolver=le"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-health.priority=100"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-health.service=${COMPOSE_PROJECT_NAME}"

      # API router — no Authelia, because a program cannot do an interactive
      # 2FA login. `PathPrefix(/api/v1)` is the containment, and it is the most
      # dangerous label in this file: widen it to `/api` and `/api/status`
      # loses Authelia; drop the PathPrefix and the whole admin surface does.
      # `make verify` asserts the rule for that reason. What stands in for
      # Authelia here is the bearer token checked in sonde/web/apikey.py.
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.rule=Host(`${SERVICE_HOST}`) && PathPrefix(`/api/v1`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.tls.certresolver=le"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.priority=90"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.service=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.middlewares=${COMPOSE_PROJECT_NAME}-api-rate@docker"
      # Not a defence against token guessing — a 43-character secret does not
      # fall to a rate limit — but it keeps one runaway client from putting a
      # sustained read load on a SQLite file that the sweeps are writing to.
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-api-rate.ratelimit.average=30"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-api-rate.ratelimit.burst=60"

      - "homepage.group=Applications"
      - "homepage.name=sonde"
      - "homepage.icon=mdi-radar"
      - "homepage.href=https://${SERVICE_HOST}"
      - "homepage.description=Bluesky follower tracker"
      - "homepage.instance=my-docker"
    volumes:
      # Live DB in a named volume.
      - sonde-data:/data
      # Snapshots go to a host bind mount rather than a named volume, so they
      # are reachable from the host without docker cp. On-box only by choice —
      # see PLAN.md §9; this is not disaster recovery.
      - ${BACKUP_HOST_DIR:-/home/danhon/sonde-backups}:/backup

networks:
  traefik_default:
    external: true

volumes:
  sonde-data:
