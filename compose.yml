services:
  app:
    build:
      context: .
      args:
        - GIT_SHA
        - BUILD_TIME
    env_file: .env
    restart: unless-stopped
    # Bounded, so an exception anyone can trigger can't fill the disk. A
    # deployment may swap in its own driver (the author's uses the journal).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # sonde/healthcheck.py probes /healthz; a reverse proxy should route only to
    # a healthy container.
    healthcheck:
      test: ["CMD", "python3", "-I", "-S", "/app/sonde/healthcheck.py"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 1s
    volumes:
      # Live DB in a named volume.
      - sonde-data:/data
      # Nightly DB snapshots, on the host so they can be copied off it. The
      # container runs as uid 10001, which must be able to write here.
      - ${BACKUP_HOST_DIR:-./backups}:/backup
      # JSON lines in app.log, for whatever reads your logs.
      - ${SONDE_LOG_DIR:-./logs}:/logs

volumes:
  sonde-data:
