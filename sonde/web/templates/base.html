<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}sonde{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900 antialiased">
  <nav class="border-b-2 border-slate-900 bg-white">
    <div class="mx-auto flex max-w-6xl items-baseline gap-6 px-6 py-4">
      <a href="/" class="font-mono text-xl font-semibold tracking-tight">sonde</a>
      <a href="/followers" class="font-mono text-xs uppercase tracking-widest text-slate-500 hover:text-red-800">Followers</a>
      <a href="/influential" class="font-mono text-xs uppercase tracking-widest text-slate-500 hover:text-red-800">Influential</a>
      <a href="/verified" class="font-mono text-xs uppercase tracking-widest text-slate-500 hover:text-red-800">Verified</a>
      <a href="/changes" class="font-mono text-xs uppercase tracking-widest text-slate-500 hover:text-red-800">Changes</a>
      <span class="ml-auto font-mono text-xs uppercase tracking-widest text-slate-400">{{ settings.actor }}</span>
      <span class="font-mono text-xs text-slate-400">{{ settings.build_sha }}</span>
    </div>
  </nav>
  <main class="mx-auto max-w-6xl px-6 py-10">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
